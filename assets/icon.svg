<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e6d78"/><stop offset=".55" stop-color="#3b444e"/><stop offset="1" stop-color="#242a31"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".22" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#e6f0f5" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="caustic" cx=".5" cy="1.02" r=".7">
      <stop offset="0" stop-color="#d8e8f2" stop-opacity=".55"/><stop offset="1" stop-color="#d8e8f2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".4" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fa"/><stop offset="1" stop-color="#c9d5dc"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#caustic)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#top)"/>
  </g>
  <rect x="104" y="104" width="816" height="816" rx="186" fill="none" stroke="url(#rim)" stroke-width="8"/>
  <!-- marca: três cartões soltos num quadro (canvas) -->
  <g filter="url(#sh)">
    <rect x="292" y="300" width="250" height="300" rx="34" fill="url(#tile)"/>
    <rect x="580" y="300" width="152" height="152" rx="34" fill="url(#tile)" opacity=".92"/>
    <rect x="580" y="490" width="152" height="234" rx="34" fill="url(#tile)" opacity=".82"/>
    <rect x="292" y="638" width="250" height="86" rx="34" fill="url(#tile)" opacity=".7"/>
  </g>
</svg>
