# Gera o app de desktop: .dmg (Mac Apple Silicon) e instalador .exe (Windows).
# Roda sozinho a cada push na main (artifacts .dmg/.exe), ao criar uma tag v* (release em rascunho) e pelo botão "Run workflow" na aba Actions.
name: Build app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: mac-apple-silicon
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: windows-latest
            label: windows
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar dependências
        run: |
          npm ci
          npm ci --prefix vendor

      - name: Gerar a página do app (build.py)
        run: python build.py

      - name: Compilar com Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Space {0}', github.ref_name) || '' }}
          releaseBody: 'Veja o CHANGELOG.md. No Mac, se aparecer "app danificado": xattr -cr /Applications/Space.app'
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Guardar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: space-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: error
