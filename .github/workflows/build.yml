# Gera o app de desktop: .dmg (Mac Apple Silicon) e instalador .exe (Windows).
# Roda sozinho a cada push na main e publica em Releases deste repositório (tag v<versão do tauri.conf.json>,
# criada pelo próprio Actions). O app instalado procura atualizações no latest.json da release mais recente.
# Mesma versão = mesma release (arquivos substituídos). Para uma atualização nova, suba a versão em
# package.json, src-tauri/Cargo.toml e src-tauri/tauri.conf.json.
# Segredo necessário (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY  chave privada que assina as atualizações (a pública está no tauri.conf.json) — configurado em 2026-10-14
name: Build app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: mac-apple-silicon
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: windows-latest
            label: windows
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar dependências
        run: |
          npm ci
          npm ci --prefix vendor

      - name: Gerar a página do app (build.py)
        run: python build.py

      - name: Compilar com Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: Space v__VERSION__
          releaseBody: 'Primeira instalação no Mac: arraste o Space para Aplicativos e rode no Terminal: xattr -cr /Applications/Space.app — depois disso o app se atualiza sozinho.'
          releaseDraft: false
          args: ${{ matrix.args }}

      - name: Guardar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: space-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: error
